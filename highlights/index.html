<style>
    .hl-head h1 { margin-bottom: .2em; }
    .hl-card, .hl-nav { text-align: left; }
    .hl-sub { color: var(--c2); margin-top: 0; }
    .hl-lite { color: var(--c2); font-size: .85rem; margin: -.4rem 0 1rem; }
    .hl-lite[hidden] { display: none; }

    .hl-card { position: relative; margin: 0; min-height: 19rem; display: flex; flex-direction: column; justify-content: center;
        padding: clamp(1.6rem, 5vw, 3.2rem); padding-top: clamp(2.6rem, 7vw, 3.6rem);
        background: var(--card); border: 1px solid var(--bd); border-radius: 20px; box-shadow: 0 10px 30px var(--shade);
        touch-action: pan-y; user-select: text; }
    .hl-card::before { content: "“"; position: absolute; top: -.05em; left: .25em; font: 700 6.5rem/1 Georgia, serif; color: var(--accent); opacity: .22; pointer-events: none; }
    .hl-quote { margin: 0; padding: 0; border: 0; background: none; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        font-size: clamp(1.12rem, .95rem + 1vw, 1.5rem); line-height: 1.6; color: var(--fg); white-space: pre-line; font-style: normal; }
    .hl-quote::before, .hl-quote::after { content: none; }
    .hl-quote.is-long { font-size: clamp(1rem, .9rem + .6vw, 1.22rem); }
    .hl-cap { margin-top: 1.6em; display: flex; flex-wrap: wrap; align-items: baseline; gap: .25em .6em; font-size: .92em; }
    .hl-book { font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--bd); }
    .hl-book::before { content: "— "; color: var(--c2); font-weight: 400; }
    .hl-author { color: var(--c2); }
    .hl-types { display: inline-flex; gap: .3em; flex-wrap: wrap; }
    .hl-types span { font-size: .75em; text-transform: uppercase; letter-spacing: .05em; color: var(--c2); border: 1px solid var(--bd); border-radius: 999px; padding: 0 .55em; }

    .hl-card > * { transition: opacity .22s ease, transform .22s ease; }
    .hl-card.is-out > * { opacity: 0; transform: translateY(6px); }
    .hl-card.is-out.go-back > * { transform: translateY(-6px); }
    @media (prefers-reduced-motion: reduce) { .hl-card > * { transition: none; } }

    .hl-nav { display: flex; align-items: center; justify-content: space-between; gap: 1em; margin-top: 1.2em; }
    .hl-btn { font: inherit; padding: .6em 1.1em; border-radius: 12px; border: 1px solid var(--bd); background: transparent; color: inherit; cursor: pointer; min-width: 3.2em; }
    .hl-next { background: var(--fg); border-color: var(--fg); color: var(--bg); padding-left: 1.4em; padding-right: 1.4em; }
    .hl-btn:disabled { opacity: .35; cursor: default; }
    .hl-pos { color: var(--c2); font-size: .85em; font-variant-numeric: tabular-nums; }
    .hl-hint { color: var(--c2); font-size: .8em; text-align: center; margin-top: 1.4em; }
</style>

<script>
(function () {
    
    
    
    var $ = function (id) { return document.getElementById(id); };
    var card = $('hl-card'), quoteEl = $('hl-quote'), bookEl = $('hl-book'), authorEl = $('hl-author'),
        typesEl = $('hl-types'), posEl = $('hl-pos'), prevBtn = $('hl-prev'), nextBtn = $('hl-next'),
        chipsEl = $('hl-chips'), subEl = $('hl-sub'), liteEl = $('hl-lite');
    var conn = navigator.connection || {};
    var lite = /[?&]lite\b/.test(location.search) || !!conn.saveData || /2g|3g/.test(conn.effectiveType || '');
    var BIG = 30000, ACTIVE = lite ? 4 : 8, AHEAD = lite ? 6 : 12, PER_VISIT = 3;
    var books = [], cache = {}, seen = {}, deck = [], active = [], later = [], pending = [], pos = 0, type = '', withBig = !lite, busy = null;

    function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
    function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
    function fmt(n) { return n.toLocaleString(); }
    function eligible(bi) { var b = books[bi]; return (!type || b.k.indexOf(type) > -1) && (withBig || b.s <= BIG); }

    function load(bi) {
        if (cache[bi]) return Promise.resolve(cache[bi]);
        return fetch(books[bi].f).then(function (r) { return r.json(); }).then(function (qs) {
            cache[bi] = qs.filter(function (q) {
                var key = q.toLowerCase().replace(/\W+/g, '');
                if (seen[key]) return false;
                seen[key] = 1; return true;
            });
            return cache[bi];
        }).catch(function () { return []; });
    }

    
    
    function dealRound() {
        shuffle(active);
        active = active.filter(function (p) {
            deck.push([p.bi, p.rest.pop()]);
            p.given = (p.given || 0) + 1;
            if (!p.rest.length) return false;
            if (p.given >= PER_VISIT) { p.given = 0; later.push(p); return false; }
            return true;
        });
    }

    function ensure() {
        if (busy) return busy;
        function step() {
            if (deck.length - pos > AHEAD) return Promise.resolve();
            var room = Math.max(0, ACTIVE - active.length);
            var take = pending.splice(0, room);
            if (take.length < room) active = active.concat(later.splice(0, room - take.length));
            return Promise.all(take.map(load)).then(function (lists) {
                lists.forEach(function (qs, i) {
                    if (qs.length) active.push({ bi: take[i], rest: shuffle(qs.map(function (_, j) { return j; })) });
                });
                if (!active.length) return;
                dealRound();
                return step();
            });
        }
        busy = step().then(function () { busy = null; }, function () { busy = null; });
        return busy;
    }

    function reset(first) {
        deck = []; active = []; later = []; pos = 0;
        pending = shuffle(books.map(function (_, i) { return i; }).filter(eligible));
        if (first) {
            pending = pending.filter(function (bi) { return bi !== first[0]; });
            return load(first[0]).then(function (qs) {
                if (!qs[first[1]]) return;
                deck.push(first);
                var rest = shuffle(qs.map(function (_, j) { return j; }).filter(function (j) { return j !== first[1]; }));
                if (rest.length) active.push({ bi: first[0], rest: rest });
            });
        }
        return Promise.resolve();
    }

    function render(back) {
        if (!deck.length) { quoteEl.textContent = 'No highlights for this type yet.'; posEl.textContent = ''; return; }
        var d = deck[pos], text = cache[d[0]][d[1]], b = books[d[0]];
        card.classList.add('is-out'); card.classList.toggle('go-back', !!back);
        setTimeout(function () {
            quoteEl.textContent = text;
            quoteEl.classList.toggle('is-long', text.length > 320);
            bookEl.textContent = b.t + (b.r ? ' (review)' : '');
            bookEl.href = b.u;
            authorEl.textContent = b.a || '';
            typesEl.innerHTML = '';
            b.k.forEach(function (t) { var s = document.createElement('span'); s.textContent = t; typesEl.appendChild(s); });
            posEl.textContent = fmt(pos + 1) + ' of ' + fmt(total());
            prevBtn.disabled = pos === 0;
            try { history.replaceState(null, '', '#b' + d[0] + '.' + d[1]); } catch (e) {}
            card.classList.remove('is-out');
        }, 180);
    }

    function total() { var n = 0; books.forEach(function (b, i) { if (eligible(i)) n += b.n; }); return n; }

    function next() {
        if (pos < deck.length - 1) { pos++; render(false); ensure(); return; }
        if (busy) { busy.then(next); return; }
        reset().then(ensure).then(function () { render(false); });
    }
    function prev() { if (pos > 0) { pos--; render(true); } }

    function chips() {
        var counts = {}, all = 0;
        books.forEach(function (b, i) {
            if (!withBig && b.s > BIG) return;
            all += b.n;
            b.k.forEach(function (t) { counts[t] = (counts[t] || 0) + b.n; });
        });
        var types = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
        chipsEl.innerHTML = '';
        [''].concat(types).forEach(function (t) {
            var c = document.createElement('button');
            c.type = 'button'; c.className = 'chip hl-chip' + (t === type ? ' is-on' : '');
            c.innerHTML = (t || 'All') + ' <span>' + fmt(t ? counts[t] : all) + '</span>';
            c.addEventListener('click', function () {
                type = t; store('hl-type', t);
                [].forEach.call(chipsEl.children, function (x) { x.classList.toggle('is-on', x === c); });
                reset().then(ensure).then(function () { render(false); });
            });
            chipsEl.appendChild(c);
        });
        var nb = 0; books.forEach(function (b, i) { if (withBig || b.s <= BIG) nb++; });
        subEl.textContent = fmt(all) + ' highlights from ' + fmt(nb) + ' books, one at a time.';
    }

    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);
    document.addEventListener('keydown', function (e) {
        if (e.target.closest && e.target.closest('input, textarea')) return;
        if (e.key === 'ArrowRight' || e.key === 'j' || (e.key === ' ' && e.target === document.body)) { e.preventDefault(); next(); }
        if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); prev(); }
    });
    var x0 = null, y0 = null;
    card.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    card.addEventListener('touchend', function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? next() : prev(); }
        x0 = null;
    }, { passive: true });
    $('hl-all').addEventListener('click', function () {
        withBig = true; liteEl.hidden = true;
        var have = {}; deck.forEach(function (d) { have[d[0]] = 1; }); active.forEach(function (p) { have[p.bi] = 1; });
        books.forEach(function (b, i) { if (eligible(i) && !have[i] && pending.indexOf(i) < 0) pending.push(i); });
        shuffle(pending); chips(); render(false);
    });

    fetch('\/highlights\/index.json')
        .then(function (r) { return r.json(); })
        .then(function (data) {
            books = data;
            liteEl.hidden = !lite || !books.some(function (b) { return b.s > BIG; });
            var saved = store('hl-type');
            if (saved && books.some(function (b) { return b.k.indexOf(saved) > -1; })) type = saved;
            var m = location.hash.match(/^#b(\d+)\.(\d+)$/), first = null;
            if (m && books[+m[1]]) { first = [+m[1], +m[2]]; type = ''; withBig = true; }
            chips();
            return reset(first).then(ensure).then(function () { render(false); });
        })
        .catch(function () { subEl.textContent = 'Could not load the highlights.'; });
})();
</script>
